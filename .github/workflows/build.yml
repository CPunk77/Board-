name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: |
          unzip -q MyBoard-project.zip -d proj
          cd proj
          gradle assembleDebug 
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" proj/app/build/outputs/apk/debug/app-debug.apk --title "Клавиатура"
